name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Allow manual runs for testing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is taken from package.json's `packageManager` field —
        # don't duplicate it here or the action errors out.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Import the Developer ID Application certificate into a throw-away
      # keychain so codesign + notarize can find it. Bails out cleanly when
      # the secret isn't configured (forks, CI without signing), in which
      # case the build still runs but produces an unsigned .app.
      - name: Import Apple signing certificate
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "APPLE_CERTIFICATE_BASE64 secret not set — skipping signing setup."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Make the keychain searchable (preserve login.keychain in the list).
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build & package
        env:
          # Signing + notarization only kick in on the mac runner; the
          # postMake hook + osxNotarize block in forge.config.ts are no-ops
          # when these are empty.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.AppImage
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/*.zip
            out/make/**/*.dmg
            out/make/**/RELEASES
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only run on actual tag pushes — workflow_dispatch builds for testing
    # but doesn't publish a release.
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.exe' -o -name '*.nupkg' -o -name '*.zip' \
               -o -name '*.dmg' -o -name 'RELEASES' \) \
            -exec cp -v {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-aur:
    name: Publish nodepdf-bin to AUR
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Wait for the .deb asset to be reachable. softprops/action-gh-release
      # uploads sequentially and AWS occasionally lags a few seconds before
      # the public URL serves the bytes.
      - name: Fetch the freshly-released .deb (with retry)
        id: deb
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.version }}/node-pdf_${{ steps.ver.outputs.version }}_amd64.deb"
          for i in 1 2 3 4 5; do
            if curl -fsSL -o /tmp/pkg.deb "$URL"; then
              break
            fi
            echo "attempt $i failed, sleeping 10s"
            sleep 10
          done
          SHA=$(sha256sum /tmp/pkg.deb | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Computed sha256: $SHA"

      - name: Update PKGBUILD with new version + sha256
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.ver.outputs.version }}/" aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${{ steps.deb.outputs.sha }}')/" aur/PKGBUILD
          cat aur/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: nodepdf-bin
          pkgbuild: aur/PKGBUILD
          commit_username: Rafael Maldonado
          commit_email: remdph@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "upgpkg: nodepdf-bin ${{ steps.ver.outputs.version }}-1"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          allow_empty_commits: false
          force_push: false
